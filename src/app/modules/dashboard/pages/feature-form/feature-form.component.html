<h2>Add feature</h2>
<form [formGroup]="form">
  <mat-form-field appearance="outline">
    <mat-label>Feature Name *</mat-label>
    <input matInput cdkFocusInitial
      formControlName="featureName"
    >
    <mat-error *ngIf="form.controls.featureName.invalid">
      {{ getFormError(form.controls.featureName) }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Importance *</mat-label>
    <input matInput
      type="number"
      formControlName="importance"
    >
    <mat-error *ngIf="form.controls.importance.invalid">
      {{ getFormError(form.controls.importance) }}
    </mat-error>
  </mat-form-field>

  <mat-form-field appearance="outline">
    <mat-label>Quantity *</mat-label>
    <input matInput
      type="number"
      formControlName="quantity"
    >
    <mat-error *ngIf="form.controls.quantity.invalid">
      {{ getFormError(form.controls.quantity) }}
    </mat-error>
  </mat-form-field>

  <div mat-dialog-actions align="end">
    <button mat-stroked-button
      class="button-cancel"
      (click)="cancel()"
    >
      Cancel
    </button>
    <button mat-flat-button
      class="button-create-feature"
      color="primary"
      (click)="submit()"
    >
      Create
    </button>
  </div>
</form>
