<mat-card>
  <mat-card-title>
    Login
  </mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field appearance="outline">
        <mat-label>Email *</mat-label>
        <input
          type="text"
          matInput
          placeholder="marc@craftnote.de"
          formControlName="email"
        >
        <mat-error *ngIf="form.get('email')?.invalid">
          {{ getEmailError(form.controls.email) }}
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password *</mat-label>
        <input
          type="password"
          matInput
          placeholder="Password"
          formControlName="password"
        >
        <mat-error *ngIf="form.get('password')?.invalid">
          {{ getPasswordError(form.controls.password) }}
        </mat-error>
      </mat-form-field>

      <div
        *ngIf="(loginError$ | async) as error"
        class="login-error"
      >
        <mat-error>{{ error }}</mat-error>
      </div>

      <div class="form-actions">
        <button
          mat-stroked-button
          [routerLink]="['/register']"
        >
          Create account
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
          (click)="submit()"
        >
          Login
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
