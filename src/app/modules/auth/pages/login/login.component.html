<mat-card>
  <mat-card-title>
    Login
  </mat-card-title>
  <mat-card-content>
    <form [formGroup]="form">
      <mat-form-field>
        <input
          type="text"
          matInput
          placeholder="Username"
          formControlName="email"
        >
        <mat-error *ngIf="form.get('email')?.invalid">
          {{ getEmailError() }}
        </mat-error>
      </mat-form-field>

      <mat-form-field>
        <input
          type="password"
          matInput
          placeholder="Password"
          formControlName="password"
        >
        <mat-error *ngIf="form.get('password')?.invalid">
          {{ getPasswordError() }}
        </mat-error>
      </mat-form-field>

      <div
        *ngIf="(loginError$ | async) as error"
        class="login-error"
      >
        <mat-error>{{ error }}</mat-error>
      </div>

      <div class="form-actions">
        <button
          mat-stroked-button
          [routerLink]="['/register']"
        >
          Create account
        </button>
        <button
          type="submit"
          mat-raised-button
          color="primary"
          (click)="submit()"
        >
          Login
        </button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
